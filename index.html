<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মুভি তথ্য সার্চ (বাংলা)</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
  h2 { color: #333; }
  input { padding: 10px; width: 70%; max-width: 300px; margin-right: 10px; }
  button { padding: 10px; cursor: pointer; }
  #result { margin-top: 20px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  #result img { max-width: 200px; display: block; margin-bottom: 10px; }
  p { margin: 5px 0; }
</style>
</head>
<body>
<h2>মুভি তথ্য সার্চ</h2>
<input type="text" id="movieName" placeholder="মুভির নাম লিখুন" />
<button onclick="searchMovie()">সার্চ</button>

<div id="result"></div>

<script>
async function translateToBangla(text) {
  try {
    const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURIComponent(text)}`);
    const data = await response.json();
    return data[0].map(item => item[0]).join('');
  } catch (err) {
    console.error('Translation error:', err);
    return text; // ব্যর্থ হলে ইংরেজি প্লট দেখাবে
  }
}

async function searchMovie() {
  const name = document.getElementById('movieName').value.trim();
  if(!name) return alert('মুভির নাম লিখুন!');

  const apiKey = 'ac57015f'; // তোমার OMDb API key
  const url = `https://www.omdbapi.com/?t=${encodeURIComponent(name)}&apikey=${apiKey}`;

  try {
    const response = await fetch(url);
    const data = await response.json();

    const resultDiv = document.getElementById('result');
    if(data.Response === "False") {
      resultDiv.innerHTML = 'মুভি পাওয়া যায়নি।';
      return;
    }

    const poster = data.Poster && data.Poster !== "N/A" ? data.Poster : "https://via.placeholder.com/200x300?text=No+Image";

    // প্লট বাংলায় অনুবাদ
    const plotBN = await translateToBangla(data.Plot);

    resultDiv.innerHTML = `
      <img src="${poster}" alt="Poster">
      <h3>${data.Title} (${data.Year})</h3>
      <p><strong>অভিনেতা:</strong> ${data.Actors}</p>
      <p><strong>প্লট:</strong> ${plotBN}</p>
    `;
  } catch (err) {
    document.getElementById('result').innerHTML = 'ত্রুটি ঘটেছে। আবার চেষ্টা করুন।';
    console.error(err);
  }
}
</script>
</body>
</html>
