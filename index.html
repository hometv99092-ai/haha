<meta name='viewport' content='width=device-width, initial-scale=1'/>
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie & Game Drive</title>
<style>
:root {
  --bg-color: #f1f5f9;
  --text-color: #000;
  --folder-bg: #0ea5e9;
  --folder-text: #fff;
  --payment-bg: #fef3c7;
  --btn-bg: #22c55e;
  --ai-bg: #fff;
  --ai-text: #000;
}
body.dark {
  --bg-color: #121212;
  --text-color: #e0e0e0;
  --folder-bg: #1e40af;
  --folder-text: #fff;
  --payment-bg: #1f2937;
  --btn-bg: #16a34a;
  --ai-bg: #1f2937;
  --ai-text: #fff;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg-color);
  color: var(--text-color);
  padding: 20px;
  transition: all 0.3s;
}
h1{text-align:center;}
.folder{
  background:var(--folder-bg);
  color:var(--folder-text);
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  cursor:pointer;
  display:none;
  transition: all 0.3s;
}
.subfolder{display:none;margin-left:20px}
.link{display:none;margin:6px 0}
.payment-box{
  background:var(--payment-bg);
  padding:15px;
  border-radius:10px;
  text-align:center;
  margin-bottom:20px;
  transition: all 0.3s;
}
button{
  background:var(--btn-bg);
  border:none;
  color:white;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
  transition: all 0.3s;
}
input{padding:8px;width:180px;}
.show-pass-btn{background:#3b82f6;color:#fff;border:none;padding:8px;border-radius:6px;}
a{text-decoration:none;font-weight:bold;color:inherit;}
#searchBox{display:none;margin:15px 0;padding:8px;width:95%;}

/* AI Button */
#aiBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--btn-bg);
  color:#fff;
  font-size:18px;
  border:none;
  cursor:pointer;
  display:none;
  z-index:999;
}

/* AI Box */
#aiBox{
  position:fixed;
  bottom:90px;
  right:20px;
  width:350px;
  max-width:95%;
  max-height:480px;
  background:var(--ai-bg);
  color:var(--ai-text);
  border-radius:12px;
  padding:12px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
  display:none;
  z-index:999;
  overflow:auto;
  transition: all 0.3s;
}
#aiBox input{
  width:100%;
  margin-bottom:8px;
  padding:6px;
  border-radius:6px;
  border:1px solid #ccc;
  outline:none;
}
#aiResult{
  font-size:14px;
  overflow:auto;
}
#aiResult img{
  width:70px;
  height:105px;
  object-fit:cover;
  border-radius:4px;
  float:left;
  margin-right:8px;
  margin-bottom:6px;
  cursor:pointer;
}
#aiResult div{
  overflow:hidden;
  margin-bottom:6px;
  padding-bottom:6px;
  border-bottom:1px solid #ddd;
}

/* Suggestions */
#suggestions{
  display:none;
  max-height:180px;
  overflow:auto;
  margin-bottom:8px;
  border:1px solid #ccc;
  border-radius:6px;
}
.sug{
  display:flex;
  gap:8px;
  padding:6px;
  cursor:pointer;
  align-items:center;
}
.sug img{
  width:38px;
  height:56px;
  object-fit:cover;
  border-radius:4px;
}
.sug:hover{
  background:#3b82f6;
  color:white;
}

/* Poster Modal */
#posterModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#posterModal img{
  max-width:90%;
  max-height:90%;
  border-radius:10px;
}
#posterModal span{
  position:absolute;
  top:15px;
  right:20px;
  color:white;
  font-size:30px;
  cursor:pointer;
}

/* Theme button */
#themeBtn{
  position:fixed;
  top:20px;
  right:20px;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#6b7280;
  color:white;
  cursor:pointer;
  z-index:1000;
}
</style>
</head>
<body>

<h1>📂 SIAM</h1>
<button id="themeBtn">Theme</button>

<div class="payment-box" id="paymentBox">
<h3>🔐 সাবস্ক্রিপশন</h3>
bKash / Nagad: 01775487928 <br>
Amount: 5 টাকা <br><br>

<input type="password" id="passInput" placeholder="পাসওয়ার্ড দিন">
<button class="show-pass-btn" onclick="togglePassword()">👁</button><br><br>
<button onclick="unlockAll()">Access</button>

<hr>
<h4>📧 পাসওয়ার্ড পেতে ইমেইল দিন</h4>
<form id="emailForm">
<input type="email" name="email" required placeholder="আপনার ইমেইল">
<br><br>
<button type="submit">Send</button>
</form>
</div>

<!-- Search bar -->
<input type="text" id="searchBox" placeholder="🔍 Movie / Series খুঁজুন..." onkeyup="searchItem()">

<!-- Movies -->
<div class="folder" onclick="toggle('m1')">🎬 Chainsaw Man The Movie Reze Arc</div>
<div class="subfolder" id="m1">
  <div class="link unlock">
    <a href="https://drive.google.com/file/d/1iGwkL4uV_bWVWlUMjtw7ZQ32wmr4W8c1/preview?usp=sharing">▶ ভিডিও দেখো</a> | 
    <a href="https://drive.google.com/file/d/1iGwkL4uV_bWVWlUMjtw7ZQ32wmr4W8c1/view?usp=sharing">⬇ ডাউনলোড</a>
  </div>
</div>

<!-- AI Button -->
<button id="aiBtn" onclick="toggleAI()">AI</button>
<div id="aiBox">
  <input type="text" id="aiInput" placeholder="মুভির নাম লিখুন">
  <div id="suggestions"></div>
  <div id="aiResult"></div>
</div>

<!-- Poster Modal -->
<div id="posterModal">
  <span onclick="closeModal()">×</span>
  <img id="modalImg" src="">
</div>

<script>
const PASSWORD = "SIAM2025";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVYLvydsrfz9xrxZ29QizJfDL6HhynrgI7M9tQ_teql6Yz7ZQ_5n_vbpRQs6g5AcER/exec";
const OMDB_KEY = "ac57015f";

function toggle(id){ document.getElementById(id).style.display = document.getElementById(id).style.display==="block"?"none":"block"; }

function unlockAll(){
  if(passInput.value===PASSWORD){
    localStorage.ok=1;
    document.querySelectorAll(".unlock").forEach(e=>e.style.display="block");
    paymentBox.style.display="none";
    searchBox.style.display="block";
    aiBtn.style.display="block";
    document.querySelectorAll(".folder").forEach(f=>f.style.display="block");
  }else alert("ভুল পাসওয়ার্ড");
}

if(localStorage.ok){
  document.querySelectorAll(".unlock").forEach(e=>e.style.display="block");
  paymentBox.style.display="none";
  searchBox.style.display="block";
  aiBtn.style.display="block";
  document.querySelectorAll(".folder").forEach(f=>f.style.display="block");
}

function togglePassword(){ passInput.type = passInput.type==="password"?"text":"password"; }

function searchItem(){
  let q=searchBox.value.toLowerCase();
  document.querySelectorAll(".folder").forEach(item=>item.style.display=item.innerText.toLowerCase().includes(q)?"block":"none");
}

document.getElementById("emailForm").onsubmit=function(e){
  e.preventDefault();
  fetch(SCRIPT_URL,{method:"POST",body:new URLSearchParams({email:this.email.value})})
  .then(()=>alert("ধন্যবাদ 🙏 আপনার ইমেইলে দ্রুত পাসওয়ার্ড পাঠানো হবে"))
  .catch(()=>alert("সমস্যা হয়েছে, পরে চেষ্টা করুন"));
  this.reset();
};

function toggleAI(){
  if(!localStorage.ok){ alert("আগে পাসওয়ার্ড দিন"); return; }
  aiBox.style.display = aiBox.style.display==="block"?"none":"block";
  aiInput.focus();
}

/* Auto-suggest + Google style */
async function translateBN(text){ try{let r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q="+encodeURIComponent(text)); let d=await r.json(); return d[0].map(i=>i[0]).join(""); }catch(e){ return text;} }

let list=[];
aiInput.oninput = async ()=>{
  let q = aiInput.value.trim();
  if(!q){ suggestions.style.display="none"; aiResult.innerHTML=""; return; }
  let r=await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&apikey=${OMDB_KEY}`);
  let d=await r.json();
  if(d.Response==="False") return;
  list=d.Search.map(x=>({...x,score:x.Title.toLowerCase().includes(q.toLowerCase())?1:0})).sort((a,b)=>b.score-a.score).slice(0,5);
  suggestions.innerHTML="";
  list.forEach(m=>{
    let div=document.createElement("div");
    div.className="sug";
    div.innerHTML=`<img src="${m.Poster!=="N/A"?m.Poster:"https://via.placeholder.com/40x60"}"><div><b>${m.Title}</b><br><small>${m.Year}</small></div>`;
    div.onclick=()=>loadMovie(m.imdbID);
    suggestions.appendChild(div);
  });
  suggestions.style.display="block";
};

async function loadMovie(id){
  aiResult.innerHTML="লোড হচ্ছে...";
  let r=await fetch(`https://www.omdbapi.com/?i=${id}&apikey=${OMDB_KEY}`);
  let d=await r.json();
  let plotBN=await translateBN(d.Plot||"No plot available");
  aiResult.innerHTML=`<img src="${d.Poster!=="N/A"?d.Poster:"https://via.placeholder.com/70x105"}" id="posterThumb"><div><b>${d.Title} (${d.Year})</b><br><b>🎭 অভিনেতা:</b> ${d.Actors}<br><b>📖 কাহিনি:</b><br>${plotBN}</div>`;
  document.getElementById("posterThumb").onclick=function(){ modalImg.src=d.Poster!=="N/A"?d.Poster:"https://via.placeholder.com/300x450"; posterModal.style.display="flex"; }
  suggestions.style.display="none"; aiInput.focus(); aiInput.select();
}

function closeModal(){ posterModal.style.display="none"; }

/* Theme */
if(localStorage.theme==="dark") document.body.classList.add("dark");
themeBtn.onclick=function(){ document.body.classList.toggle("dark"); localStorage.theme=document.body.classList.contains("dark")?"dark":"light"; }
</script>
</body>
</html>
